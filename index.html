<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Feed MIS • Stock</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e6e9ef;--accent:#2563eb;--accent2:#eff6ff;--shadow:0 8px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.wrap{max-width:1200px;margin:auto;padding:18px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.status{font-size:12px;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;padding:7px 10px;border-radius:999px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.select,.search{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font-size:14px;outline:none}.select{min-width:170px}.search{flex:1;min-width:220px}
.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0 2px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1200px;margin:auto;padding:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.metric b{display:block;font-size:24px}.metric span{font-size:12px;color:var(--muted)}
.section{margin:22px 0}.section h2{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}.card:hover{transform:translateY(-1px);border-color:#c7d2fe}.cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.name{font-size:15px;font-weight:750;margin:7px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stock{display:flex;align-items:end;justify-content:space-between}.stock strong{font-size:25px}.stock small{font-size:11px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:50px 10px}.loading{padding:35px;text-align:center;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:30;padding:18px}.modal{background:#fff;max-width:850px;width:100%;max-height:90vh;overflow:auto;margin:auto;border-radius:18px}.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.close{border:0;background:#f3f4f6;border-radius:9px;width:34px;height:34px;font-size:20px;cursor:pointer}.mb{padding:20px}.detailTitle{font-size:20px;font-weight:800}.detailDate{font-size:12px;color:var(--muted);margin-top:4px}.detailSection{margin-top:20px}.detailSection h3{font-size:14px;margin:0 0 10px}.details{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}.kv{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc}.kv span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.kv b{font-size:14px}.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:14px;font-size:13px}
@media(max-width:650px){.wrap,main{padding-left:14px;padding-right:14px}.summary{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.card{padding:13px}.stock strong{font-size:21px}.top{align-items:flex-start}.status{display:none}}@media(max-width:430px){.grid{grid-template-columns:1fr}.select{flex:1}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div><div class="title">Feed MIS Stock</div><div class="sub">Category-wise • Date-wise • Material-wise</div></div><div id="status" class="status">Connecting…</div></div>
  <div class="controls"><select id="date" class="select"></select><input id="search" class="search" placeholder="Search material…" /></div>
  <div id="tabs" class="tabs"></div>
</div></header>
<main>
  <div id="summary" class="summary"></div>
  <div id="content"><div class="loading">Loading stock data…</div></div>
</main>
<div id="overlay" class="overlay"><div class="modal"><div class="mh"><div><div id="modalName" class="detailTitle"></div><div id="modalDate" class="detailDate"></div></div><button class="close" onclick="closeModal()">×</button></div><div id="modalBody" class="mb"></div></div></div>
<script>
const SUPABASE_URL = 'https://iqxprkmainafqjodpfdk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_54VfHOULYN31VknExbmdVA_mYxhtU-7';
const TABLE='feed_inventory';
let rows=[], selectedDate='', selectedCategory='ALL';
const $=id=>document.getElementById(id);
const fmt=n=>typeof n==='number' ? n.toLocaleString(undefined,{maximumFractionDigits:3}) : (n??'—');
const pretty=s=>String(s).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function closing(obj){ if(!obj||typeof obj!=='object') return null; return obj.Closing ?? obj.CLOSING ?? null; }
function catLabel(c){return String(c||'OTHER').replace(/_/g,' ')}
async function load(){
 try{
  const url=`${SUPABASE_URL}/rest/v1/${TABLE}?select=sheet_name,category,activity_date,latest_activity,for_the_month,for_the_year&order=activity_date.desc,sheet_name.asc`;
  const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
  if(!r.ok) throw new Error(await r.text());
  rows=await r.json();
  $('status').textContent='Supabase • Connected';
  const dates=[...new Set(rows.map(x=>x.activity_date).filter(Boolean))].sort().reverse();
  $('date').innerHTML=dates.map(d=>`<option value="${d}">${d}</option>`).join('');
  selectedDate=dates[0]||'';
  $('date').value=selectedDate;
  renderTabs(); render();
 }catch(e){$('status').textContent='Connection error';$('content').innerHTML=`<div class="error"><b>Supabase connection failed</b><br>${String(e.message||e)}</div>`;}
}
function renderTabs(){
 const cats=['ALL',...new Set(rows.filter(x=>x.activity_date===selectedDate).map(x=>x.category||'OTHER'))];
 $('tabs').innerHTML=cats.map(c=>`<button class="tab ${selectedCategory===c?'active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c==='ALL'?'All':catLabel(c)}</button>`).join('');
 if(!cats.includes(selectedCategory)) selectedCategory='ALL';
}
function setCat(c){selectedCategory=c;renderTabs();render()}
function render(){
 const q=$('search').value.trim().toLowerCase();
 let data=rows.filter(x=>x.activity_date===selectedDate);
 if(selectedCategory!=='ALL') data=data.filter(x=>(x.category||'OTHER')===selectedCategory);
 if(q) data=data.filter(x=>String(x.sheet_name).toLowerCase().includes(q));
 const cats=[...new Set(data.map(x=>x.category||'OTHER'))];
 $('summary').innerHTML=`<div class="metric"><b>${data.length}</b><span>Materials</span></div><div class="metric"><b>${cats.length}</b><span>Categories</span></div><div class="metric"><b>${selectedDate||'—'}</b><span>Selected date</span></div>`;
 if(!data.length){$('content').innerHTML='<div class="empty">No materials found for this date/category.</div>';return;}
 const grouped={};data.forEach(x=>(grouped[x.category||'OTHER']??=[]).push(x));
 $('content').innerHTML=Object.entries(grouped).map(([cat,list])=>`<section class="section"><h2>${catLabel(cat)} <span style="color:#9ca3af;font-weight:400">(${list.length})</span></h2><div class="grid">${list.map(card).join('')}</div></section>`).join('');
}
function card(x){const a=x.latest_activity||x.for_the_month||{};const c=closing(a);return `<div class="card" onclick="openModal(${JSON.stringify(x).replace(/</g,'\\u003c')})"><div class="cat">${catLabel(x.category)}</div><div class="name" title="${x.sheet_name}">${x.sheet_name}</div><div class="stock"><div><strong>${c===null?'—':fmt(c)}</strong> <small>STOCK</small></div><small>${x.activity_date}</small></div></div>`}
function section(title,obj){if(!obj||typeof obj!=='object')return '';return `<div class="detailSection"><h3>${title}</h3><div class="details">${Object.entries(obj).map(([k,v])=>`<div class="kv"><span>${pretty(k)}</span><b>${typeof v==='number'?fmt(v):String(v??'—')}</b></div>`).join('')}</div></div>`}
function openModal(x){$('modalName').textContent=x.sheet_name;$('modalDate').textContent=`${catLabel(x.category)} • ${x.activity_date}`;$('modalBody').innerHTML=section('Latest Activity',x.latest_activity)+section('For The Month',x.for_the_month)+section('For The Year',x.for_the_year);$('overlay').style.display='flex'}
function closeModal(){$('overlay').style.display='none'}
$('date').addEventListener('change',e=>{selectedDate=e.target.value;selectedCategory='ALL';renderTabs();render()});$('search').addEventListener('input',render);$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
load();
</script>
</body></html>
