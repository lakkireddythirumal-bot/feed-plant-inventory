<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed MIS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
    header h1{margin:0;font-size:21px}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px}
    .label{font-size:13px;color:#667085}.value{font-size:28px;font-weight:700;margin-top:7px}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-top:20px;padding:18px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}input,select,button{padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}
    button{cursor:pointer;background:#111827;color:#fff;border-color:#111827}.status{font-size:13px;color:#667085}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#f9fafb}
    .error{color:#b42318;background:#fef3f2;padding:12px;border-radius:8px}.ok{color:#027a48}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><h1>Feed MIS Dashboard</h1><span id="connection" class="status">Not connected</span></header>
<div class="wrap">
  <div class="grid">
    <div class="card"><div class="label">Total Records</div><div id="total" class="value">—</div></div>
    <div class="card"><div class="label">Latest Activity</div><div id="latest" class="value">—</div></div>
    <div class="card"><div class="label">Materials</div><div id="materials" class="value">—</div></div>
    <div class="card"><div class="label">Status</div><div id="status" class="value" style="font-size:20px">—</div></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <input id="search" placeholder="Search material..." />
      <input id="date" type="date" />
      <button id="refresh">Refresh</button>
    </div>
    <div id="message" class="status">Configure Supabase credentials, then refresh.</div>
    <div id="groups"></div>
  </div>
</div>

<script>
/*
  FRESH SUPABASE-ONLY SITE
  No Google API / Google Sheets dependency.

  1) Create a Supabase project.
  2) Create a table named: feed_mis
  3) Change the two values below.
  4) Adjust column names only if your table uses different names.
*/
const SUPABASE_URL = "https://iqxprkmainafqjodpfdk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_54VfHOULYN31VknExbmdVA_mYxhtU-7";
const TABLE_NAME = "feed_inventory";

let db = null;
let rows = [];

function configured(){
  return SUPABASE_URL.startsWith("http") &&
         !SUPABASE_URL.includes("YOUR_") &&
         !SUPABASE_ANON_KEY.includes("YOUR_");
}

async function loadData(){
  const msg = document.getElementById("message");
  msg.textContent = "Loading data...";
  document.getElementById("connection").textContent = "Connecting...";
  if(!configured()){
    msg.innerHTML = '<div class="error">Supabase URL and anon key are not configured in index.html.</div>';
    document.getElementById("connection").textContent = "Setup required";
    return;
  }

  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data, error } = await db.from(TABLE_NAME).select("*").order("imported_at",{ascending:false}).limit(1000);

  if(error){
    msg.innerHTML = '<div class="error">Supabase error: '+escapeHtml(error.message)+'</div>';
    document.getElementById("connection").textContent = "Error";
    return;
  }

  rows = data || [];
  document.getElementById("connection").textContent = "Supabase connected";
  document.getElementById("status").textContent = "Online";
  render();
}

function render(){
  const search = document.getElementById("search").value.trim().toLowerCase();
  const date = document.getElementById("date").value;

  let filtered = rows.filter(r=>{
    const material = String(r.sheet_name ?? r.material_name ?? r.material ?? r.part_name ?? "").toLowerCase();
    const category = String(r.category ?? "").toLowerCase();
    const rowDate = String(r.activity_date ?? r.date ?? r.mis_date ?? "").slice(0,10);
    return (!search || material.includes(search) || category.includes(search)) &&
           (!date || rowDate === date);
  });

  document.getElementById("total").textContent = filtered.length;
  const mats = new Set(filtered.map(r=>r.sheet_name ?? r.material_name ?? r.material ?? r.part_name).filter(Boolean));
  document.getElementById("materials").textContent = mats.size;

  const dates = filtered.map(r=>r.activity_date ?? r.date ?? r.mis_date ?? r.imported_at).filter(Boolean).sort();
  document.getElementById("latest").textContent = dates.length ? String(dates[dates.length-1]).slice(0,10) : "—";

  const grouped = {};
  filtered.forEach(r=>{
    const category = String(r.category ?? "Uncategorized").trim() || "Uncategorized";
    const name = String(r.sheet_name ?? r.material_name ?? r.material ?? r.part_name ?? "Unnamed").trim() || "Unnamed";
    if(!grouped[category]) grouped[category] = [];
    grouped[category].push({name, row:r});
  });

  const categories = Object.keys(grouped).sort((a,b)=>a.localeCompare(b));
  document.getElementById("groups").innerHTML = categories.map(category=>{
    const items = grouped[category].sort((a,b)=>a.name.localeCompare(b.name));
    return `
      <section class="group">
        <div class="group-title">
          <span>${escapeHtml(category)}</span>
          <span class="group-count">${items.length}</span>
        </div>
        ${items.map(({name,row})=>{
          const month = row.for_the_month && typeof row.for_the_month === "object" ? row.for_the_month : {};
          const latest = row.latest_activity && typeof row.latest_activity === "object" ? row.latest_activity : {};
          const closing = firstValue(month, ["Closing","closing","CLOSING"]);
          const consumption = firstValue(month, ["Consumption","CONSUMPTION","Total Consumption","TOTAL CONSUMPTION"]);
          const receipt = firstValue(month, ["Receipt","RECEIPT","Received","RECEIVED","GAIN","Gain"]);
          const issue = firstValue(month, ["Issue","ISSUE","Sale","SALE"]);
          const activityDate = row.activity_date ?? row.date ?? "";

          const detailId = "d_" + Math.random().toString(36).slice(2);
          return `
            <div class="material">
              <div class="material-row" onclick="toggleDetail('${detailId}')">
                <div class="material-name">${escapeHtml(name)}</div>
                <div class="stock-value">
                  <span class="stock-label">Closing Stock</span>
                  <span class="stock-number">${escapeHtml(formatValue(closing))}</span>
                </div>
                <div class="chevron">›</div>
              </div>
              <div id="${detailId}" class="detail">
                <div class="detail-grid">
                  <div class="metric"><span>Closing Stock</span><b>${escapeHtml(formatValue(closing))}</b></div>
                  <div class="metric"><span>Consumption</span><b>${escapeHtml(formatValue(consumption))}</b></div>
                  <div class="metric"><span>Receipt / Gain</span><b>${escapeHtml(formatValue(receipt))}</b></div>
                  <div class="metric"><span>Issue / Sale</span><b>${escapeHtml(formatValue(issue))}</b></div>
                </div>
                <div class="json-extra">Activity Date: ${escapeHtml(formatValue(activityDate))}</div>
              </div>
            </div>`;
        }).join("")}
      </section>`;
  }).join("");

  document.getElementById("message").textContent =
    filtered.length ? `${filtered.length} material record(s) loaded.` : "No records found.";
}

function toggleDetail(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle("open");
}

function firstValue(obj, keys){
  for(const k of keys){
    if(Object.prototype.hasOwnProperty.call(obj,k)) return obj[k];
  }
  return "";
}

function formatValue(v){
  if(v === null || v === undefined) return "";
  if(typeof v === "object") return JSON.stringify(v);
  return String(v);
}
function escapeHtml(v){
  return String(v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

document.getElementById("refresh").addEventListener("click", loadData);
document.getElementById("search").addEventListener("input", render);
document.getElementById("date").addEventListener("change", render);
loadData();
</script>
</body>
</html>
